# docker-compose.yml
version: '3.8'

services:
  journey-postgres:
    image: postgis/postgis:15-3.4
    container_name: journey-postgres
    environment:
      POSTGRES_USER: journey
      POSTGRES_PASSWORD: journey_dev
      POSTGRES_DB: journey
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "journey"]
      interval: 5s
      timeout: 5s
      retries: 5

  journey-redis:
    image: redis:7-alpine
    container_name: journey-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
