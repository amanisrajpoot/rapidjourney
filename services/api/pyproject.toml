[project]
name = "journey-api"
version = "0.1.0"
description = "FastAPI backend for Journey platform"
requires-python = ">=3.13"

[tool.uv]
# Using uv for fast dependency resolution

[dependency]
fastapi = { version = "^0.115.0", extras = ["standard"] }
uvicorn = "^0.30.0"
sqlalchemy = { version = "^2.0.30", extras = ["asyncio"] }
asyncpg = "^0.29.0"
geoalchemy2 = "^0.15.2"
alembic = "^1.13.2"
pydantic-settings = "^2.4.2"
python-jose = { version = "^3.3.0", extras = ["cryptography"] }
passlib = { version = "^1.7.4", extras = ["bcrypt"] }
redis = { version = "^5.0.6", extras = ["hiredis"] }
authlib = "^1.2.0"
httpx = "^0.27.2"
celery = "^5.4.0"
# For OpenRouteService and Nominatim proxies
[dependency.optional]
# Development only
pytest = "^8.3.2"
pytest-asyncio = "^0.23.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
